<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VisionCraft · 影视创作工作台</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-brand">
          <p class="eyebrow">VisionCraft</p>
          <h1>影视创作工作台</h1>
        </div>
        <div class="topbar-actions">
          <span id="projectModeBadge" class="status-pill neutral" title="自动模式：阶段完成后自动继续；监制模式：阶段完成后等待审核">自动模式</span>
          <span id="connectionStatus" class="status-pill neutral">本地模式</span>
          <button id="refreshBtn" class="icon-btn" title="刷新项目状态">⟳</button>
          <button id="deleteProjectBtn" class="secondary-btn danger-btn">删除项目</button>
          <button id="cleanupDemoBtn" class="secondary-btn">整理演示数据</button>
          <button id="exportJsonBtn" class="secondary-btn">导出 JSON</button>
          <button id="exportMdBtn" class="primary-btn">导出 Markdown</button>
        </div>
      </header>

      <main class="workspace">
        <!-- 左侧：项目与全局配置 -->
        <aside class="left-panel panel">
          <section class="panel-section" id="projectSection">
            <div class="section-title">
              <h2 id="projectSectionTitle">项目</h2>
              <button id="newProjectBtn" class="secondary-btn mini-btn" type="button">新建项目</button>
            </div>

            <!-- 查看已有项目：配置摘要 -->
            <div id="projectSummaryPanel" class="project-summary">
              <div id="summaryFields" class="summary-fields empty-state">选择或创建一个项目。</div>
              <div class="button-row compact-row">
                <button id="editProjectBtn" class="secondary-btn mini-btn" type="button">编辑项目设置</button>
                <button id="runWorkflowBtn" class="primary-btn mini-btn" type="button">启动改编流程</button>
              </div>
              <div class="button-row compact-row">
                <button id="resumeWorkflowBtn" class="secondary-btn mini-btn" type="button">恢复流程</button>
                <button id="retryWorkflowBtn" class="secondary-btn mini-btn" type="button">重试改编范围</button>
              </div>
            </div>

            <!-- 新建 / 编辑：表单 -->
            <form id="projectForm" class="project-form hidden">
              <p id="formModeNote" class="form-mode-note"></p>
              <label>
                项目名称
                <input id="titleInput" maxlength="120" placeholder="输入项目名称" />
              </label>
              <label>
                原著 / 故事文本
                <textarea id="sourceTextInput" rows="8" placeholder="粘贴故事文本，或拖拽本地文本文件到下方上传区域"></textarea>
              </label>
              <div id="textDropzone" class="dropzone" role="button" tabindex="0">
                <input id="textFileInput" type="file" accept=".txt,.md,.markdown,.json,text/plain,text/markdown,application/json" hidden />
                <strong>拖拽原著文本到这里</strong>
                <span>或点击选择本地 .txt / .md / .json 文件</span>
                <small id="uploadStatus">未选择文件</small>
              </div>
              <div class="form-grid">
                <label>
                  视觉风格
                  <select id="styleInput">
                    <option value="cinematic clean realism">电影感写实</option>
                    <option value="neo-noir rainy city">黑色悬疑雨夜</option>
                    <option value="soft sci-fi minimalism">柔和科幻极简</option>
                    <option value="ink wash animation">水墨动画</option>
                  </select>
                </label>
                <label>
                  视频比例
                  <select id="ratioInput"></select>
                </label>
                <label>
                  单镜时长
                  <select id="durationInput"></select>
                </label>
                <label>
                  镜头策略
                  <select id="shotModeInput">
                    <option value="auto">自动</option>
                    <option value="manual">手动</option>
                  </select>
                </label>
              </div>
              <label id="manualShotField" class="hidden">
                镜头数量
                <input id="shotCountInput" type="number" min="1" max="12" value="4" />
              </label>
              <label class="checkbox-row">
                <input id="reviewModeInput" type="checkbox" />
                <span>监制模式：质检后暂停，等待人工确认再继续</span>
              </label>
              <div class="button-row">
                <button id="submitProjectBtn" type="submit" class="primary-btn">创建项目</button>
                <button id="cancelFormBtn" type="button" class="secondary-btn hidden">取消</button>
              </div>
            </form>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>项目列表</h2>
              <span id="projectCount" class="muted-text">0</span>
            </div>
            <div id="projectList" class="project-list"></div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>Provider 诊断</h2>
            </div>
            <div id="providerDiagnostics" class="provider-diagnostics empty-state">等待服务状态。</div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>全局约束</h2>
            </div>
            <div id="constraintList" class="constraint-list empty-state">暂无全局约束。</div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>监制反馈</h2>
            </div>
            <textarea id="feedbackInput" rows="3" placeholder="例如：这一幕更压抑一点，光线暗一些。"></textarea>
            <button id="sendFeedbackBtn" class="primary-btn full-width">提交监制意见</button>
            <div id="feedbackResult" class="feedback-result"></div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>记忆检索</h2>
            </div>
            <div class="memory-search">
              <input id="memoryQueryInput" placeholder="检索角色、场景、原文或资产" />
              <button id="memorySearchBtn" class="secondary-btn" type="button">检索</button>
            </div>
            <div id="memoryResults" class="memory-results empty-state">等待检索。</div>
          </section>
        </aside>

        <!-- 中间：当前阶段工作区 -->
        <section class="center-panel">
          <div class="panel stage-workspace-panel">
            <div class="stage-workspace-header">
              <div class="stage-workspace-heading">
                <h2 id="stageWorkspaceTitle">文本理解</h2>
                <p id="stageWorkspaceSubtitle" class="muted-text">当前查看阶段</p>
              </div>
              <div class="stage-view-toggle" id="stageViewToggle" role="tablist">
                <button type="button" data-view="grid" class="toggle-btn active">缩略图</button>
                <button type="button" data-view="single" class="toggle-btn">单素材</button>
              </div>
            </div>
            <div id="stageGateBanner" class="stage-gate-banner"></div>
            <div id="stageWorkspace" class="stage-workspace empty-state">创建项目并启动改编流程后，这里显示当前阶段的素材。</div>
            <div id="assetDetail" class="asset-detail"></div>
          </div>
        </section>

        <!-- 右侧：完整制作流程导航 -->
        <aside class="right-panel panel">
          <section class="panel-section stage-nav-section">
            <div class="section-title">
              <h2>制作流程</h2>
            </div>
            <p class="muted-text stage-nav-hint">点击阶段只切换查看内容，不会启动任务。</p>
            <nav id="stageNav" class="stage-nav" aria-label="制作流程导航"></nav>
          </section>
        </aside>
      </main>

      <!-- 底部：实时任务中心 -->
      <footer class="task-drawer" id="taskDrawer">
        <button type="button" id="taskCenterToggle" class="task-drawer-main" aria-expanded="false">
          <div class="task-drawer-summary">
            <strong>任务中心</strong>
            <span id="jobMessage" class="muted-text">等待任务。</span>
            <span id="jobHint" class="muted-text job-hint"></span>
          </div>
          <div class="progress-track">
            <div id="jobProgress" class="progress-bar"></div>
          </div>
          <div class="task-drawer-actions">
            <span id="jobStatus" class="status-pill neutral">空闲</span>
            <span id="taskCenterChevron" class="task-chevron">展开</span>
          </div>
        </button>
        <div id="taskCenterBody" class="task-center-body hidden">
          <div id="jobList" class="job-list"></div>
          <div class="job-timeline-wrap">
            <div class="section-title">
              <h3>最近事件</h3>
            </div>
            <div id="jobTimeline" class="job-timeline"></div>
          </div>
        </div>
      </footer>
    </div>

    <!-- 未保存修改确认对话框 -->
    <div id="unsavedModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="unsavedModalTitle">
      <div class="modal-card">
        <h3 id="unsavedModalTitle">有未保存的修改</h3>
        <p id="unsavedModalMessage" class="muted-text">当前有未保存的内容。</p>
        <div class="button-row">
          <button id="unsavedSaveBtn" class="primary-btn" type="button">保存并继续</button>
          <button id="unsavedDiscardBtn" class="secondary-btn danger-btn" type="button">放弃修改</button>
          <button id="unsavedCancelBtn" class="secondary-btn" type="button">取消</button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
